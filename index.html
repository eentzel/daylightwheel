<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daylight Wheel</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>Daylight Wheel</h1>
      <div class="location">
        <label for="zip">ZIP</label>
        <!-- Not an address form field: opt out of browser and password-manager autofill
             (1Password, LastPass, Bitwarden, Dashlane). -->
        <input id="zip" type="text" inputmode="numeric" maxlength="5"
          autocomplete="off" spellcheck="false"
          data-1p-ignore data-lpignore="true" data-bwignore data-form-type="other">
        <span id="place"></span>
        <span id="zip-status" class="zip-status" role="status"></span>
      </div>
      <button id="hour-format" class="corner-toggle" type="button"
        aria-label="Switch between 12-hour and 24-hour time">
        <span class="h12">12h</span> / <span class="h24">24h</span>
      </button>
    </header>

    <section class="wheel-wrap">
      <svg id="wheel" aria-label="Sun and clock wheel"></svg>
      <p class="hint">Drag the clock face to turn it. Hold Shift to snap to 15 minutes.</p>
    </section>

    <section class="controls">
      <label for="day">Day of year: <strong id="day-label"></strong></label>
      <input id="day" type="range" min="1" max="365" step="1" list="day-marks">
      <datalist id="day-marks"></datalist>

      <div class="offset-row">
        <span>Clock: <strong id="offset"></strong></span>
        <div class="offset-buttons">
          <button id="reset" type="button">Align noon with the sun</button>
        </div>
      </div>
    </section>

    <section class="readout">
      <table>
        <thead>
          <tr><th>Event</th><th>Wheel clock</th><th>Local legal time</th></tr>
        </thead>
        <tbody id="readout-body"></tbody>
      </table>
      <dl>
        <dt>Day length</dt><dd id="day-length"></dd>
        <dt>Solar noon</dt><dd id="noon-drift"></dd>
      </dl>
    </section>

    <footer>
      ZIP code data © <a href="https://www.geonames.org/">GeoNames</a>,
      <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.
    </footer>
  </main>
</body>
</html>
