<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Daylight tests</title>
</head>
<body>
  <pre id="out">running…</pre>
  <script type="module">
    const MODULES = ['./solar.test.mjs', './location.test.mjs'];
    const lines = [];
    let total = 0;
    let failed = 0;
    for (const path of MODULES) {
      lines.push(`# ${path}`);
      try {
        const { run } = await import(path);
        for (const r of await run()) {
          total++;
          if (!r.pass) failed++;
          lines.push(`${r.pass ? 'PASS' : 'FAIL'} ${r.name}: ${r.detail}`);
        }
      } catch (err) {
        total++;
        failed++;
        lines.push(`FAIL ${path} threw: ${err}`);
      }
    }
    document.getElementById('out').textContent = lines.join('\n') +
      `\n\n${total - failed}/${total} passed` +
      (failed ? '\nRESULT: FAIL' : '\nRESULT: OK');
  </script>
</body>
</html>
